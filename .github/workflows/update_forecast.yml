name: Update carbon intensity forecast

on:
  schedule:
    # Every 6 hours. Cron is UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy xgboost scikit-learn matplotlib entsoe-py python-dotenv

      - name: Run incremental fetch + forecast refresh
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        working-directory: .
        run: python scripts/update_pipeline.py --days-back 10

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Automated data + forecast update [skip ci]"
          git push
